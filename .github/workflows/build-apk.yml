name: Build Android APK Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Cordova CLI
      run: npm install -g cordova

    - name: Setup Cordova Android Platform
      run: |
        cordova platform add android || true

    - name: Build Android APK
      run: |
        cordova build android --release || ./gradlew assembleRelease || true

    - name: Sign APK Binary
      run: |
        if [ -f "platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
          cp platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk app-release.apk
        fi

    - name: Upload Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BlinxApp-signed.apk
        path: |
          app-release.apk
          platforms/android/app/build/outputs/apk/**/*.apk
          dist/
